# .github/workflows/feast-agent.yml
# Daily Catholic feast layer board — commits data/feast/YYYY-MM-DD.html +
# latest.html back to the repo, then asks Pages to rebuild.
#
# TWO schedules, 13:07 and 17:07 UTC (9:07 and 1:07 PM ET). Actions schedules
# are best-effort and the delay is unbounded: 2026-08-14's run never fired at
# all, and 2026-08-27's landed 9h48m late. The :07 keeps both off the
# top-of-hour rush; the second slot is the actual safety net. The script is
# idempotent per date, so whichever run lands first wins and the other commits
# nothing (see the git diff --cached guard below).
name: feast-agent

on:
  schedule:
    - cron: "7 13 * * *"
    - cron: "7 17 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button for reruns

permissions:
  contents: write   # commit the board back
  pages: write      # POST /pages/builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run feast agent
        run: python3 feast_agent.py

      - name: Commit board
        id: commit
        run: |
          git config user.name "feast-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/feast/
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "no board changes — nothing to commit (second scheduled run, most likely)"
          else
            git commit -m "feast board $(date -u +%F)"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pages auto-build races the push and can resolve the PRE-push ref — on
      # 2026-08-14 it rebuilt the previous commit and served a day-old board.
      # An explicit build request after the push closes that window.
      - name: Trigger Pages rebuild
        if: steps.commit.outputs.committed == 'true'
        run: |
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds")
          echo "pages build request: HTTP $code"
          cat /tmp/pages.json 2>/dev/null || true
          if [ "$code" != "201" ]; then
            echo "::warning::Pages rebuild request returned $code (board is committed; page may lag until the next build)"
          fi
