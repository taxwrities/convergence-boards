# .github/workflows/feast-agent.yml
# Daily Catholic feast layer board — runs at 9:00 AM Eastern (13:00 UTC),
# commits data/feast/YYYY-MM-DD.html + latest.html back to the repo.
name: feast-agent

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button for reruns

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run feast agent
        run: python3 feast_agent.py

      - name: Commit board
        run: |
          git config user.name "feast-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/feast/
          git diff --cached --quiet || git commit -m "feast board $(date -u +%F)"
          git push
